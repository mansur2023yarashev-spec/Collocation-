<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alpha - Layout</title>
  <style>
    :root {
      /* CSS Variables for colors, spacing and edge padding */
      --bg: #ece7df;
      --card-1: #f8f6f1;
      --card-2: #f8f6f1;
      --card-3: #f8f6f1;
      --card-inner: #ffffff;
      --card-border: #e0dad0;
      --text: #1e2824;
      --text-secondary: #6e7872;
      --accent: #c86446;
      --accent-soft: rgba(200, 100, 70, 0.12);
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);

      /* Structural spacing */
      --gap: 6px;
      --edge: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
    }

    /* Screen Wrapper: full-screen, 100dvh, flat page canvas with only 6px padding */
    .screen-canvas {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      padding: calc(var(--edge) + env(safe-area-inset-top, 0px)) var(--edge) calc(var(--edge) + env(safe-area-inset-bottom, 0px)) var(--edge);
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      overflow: hidden;
    }

    /* 1) HEADER CARD (top, auto height, border-radius: 32px, inner padding 16px) */
    .header-card {
      background-color: var(--card-1);
      border-radius: 32px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
      background: var(--accent-soft);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .icon-btn.sparkle {
      color: var(--accent);
    }

    /* Search Bar (full width, height 52px, radius 20px) */
    .search-bar-wrap {
      margin-top: 14px;
      position: relative;
      width: 100%;
      height: 52px;
    }

    .search-bar {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      padding: 0 16px 0 46px;
      font-size: 14.5px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar::placeholder {
      color: var(--text-secondary);
      opacity: 0.85;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 19px;
      height: 19px;
      fill: var(--text-secondary);
      pointer-events: none;
    }

    .header-counter {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* 2) LIST CARD (middle, flex-1, fills all remaining space, border-radius: 32px, overflow: hidden) */
    .list-card {
      background-color: var(--card-2);
      border-radius: 32px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      display: flex;
    }

    .list-scroll-area {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 6px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px; /* 8px gap between rows */
    }

    .section-letter {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      padding: 4px 0 2px 6px;
    }

    /* List item: radius 20px, 1px border */
    .list-item-row {
      height: 50px;
      min-height: 50px;
      border-radius: 20px;
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .list-item-row:active {
      transform: scale(0.985);
      background: var(--accent-soft);
    }

    .list-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .word-text {
      font-family: "Georgia", serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .count-pill {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    .list-item-right {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .item-icon-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .item-icon-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .item-icon-btn.fav.active {
      color: var(--accent);
    }

    /* Slim vertical A–Z alphabet index */
    .alphabet-index-rail {
      width: 22px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 8px 4px 8px 0;
      flex-shrink: 0;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .alphabet-index-rail span {
      cursor: pointer;
      transition: color 0.1s;
    }

    .alphabet-index-rail span:hover,
    .alphabet-index-rail span.active {
      color: var(--accent);
    }

    /* 3) BOTTOM NAV CARD (bottom, fixed height ~64px, pill shape: border-radius: 9999px) */
    .bottom-nav-card {
      height: 64px;
      min-height: 64px;
      background-color: var(--card-3);
      border-radius: 9999px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .nav-tab {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-tab.active {
      color: var(--accent);
    }

    .nav-tab svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .nav-tab-label {
      font-size: 11.5px;
      font-weight: 600;
    }
  </style>

        document.documentElement.style.setProperty('--accent', '#d97757');
      } else {
        document.documentElement.style.setProperty('--bg', '#ece7df');
        document.documentElement.style.setProperty('--card-1', '#f8f6f1');
        document.documentElement.style.setProperty('--card-2', '#f8f6f1');

        document.documentElement.style.setProperty('--text-secondary', '#6e7872');
        document.documentElement.style.setProperty('--accent', '#c86446');
      }
    });
